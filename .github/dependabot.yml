# Abre PRs semanais para atualizar dependências, sempre na develop.
version: 2
updates:
  - package-ecosystem: npm
    directory: /Frontend
    target-branch: develop
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /Backend
    target-branch: develop
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
