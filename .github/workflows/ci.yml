name: CI

# Roda os testes do backend em todo PR para develop/main e a cada push nelas.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# O workflow só lê o repositório; não precisa de nenhuma permissão de escrita.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a rodada anterior, que já está velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Backend

    # PostgreSQL descartável, só para esta rodada (nunca o Supabase do time). O
    # ApplicationTests sobe a aplicação inteira e o Hibernate (ddl-auto=validate)
    # confere as entidades com o esquema do SQL do projeto.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: senha-so-do-ci
          POSTGRES_DB: gastromatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gastromatch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Criar o esquema do banco
        env:
          PGPASSWORD: senha-so-do-ci
        run: |
          psql -h 127.0.0.1 -U postgres -d gastromatch -v ON_ERROR_STOP=1 -f ../Data/Modelagem/GastroDB_v2.0.0_postgres.sql
          psql -h 127.0.0.1 -U postgres -d gastromatch -v ON_ERROR_STOP=1 -f ../Data/Modelagem/GastroDB_dados_exemplo.sql

      - name: Rodar os testes
        env:
          DB_PASSWORD: senha-so-do-ci
        run: |
          # Segredo JWT gerado na hora, só para esta rodada.
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          # O mvnw foi versionado sem permissão de execução.
          chmod +x mvnw
          # O jacoco-maven-plugin roda na fase "test": gera o relatório e falha o build se a
          # cobertura das classes de segurança/autenticação cair abaixo de 80% (pom.xml).
          ./mvnw -B test

      - name: Publicar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: Backend/target/site/jacoco

  testes-frontend:
    name: Testes e build do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      - name: Análise estática (lint)
        run: npm run lint

      # Só avisa: um alerta novo numa biblioteca não deve travar a publicação sem a equipe decidir.
      - name: Vulnerabilidades nas dependências
        run: npm audit --audit-level=high
        continue-on-error: true

      # Falha de teste ou cobertura abaixo de 80% em src/lib bloqueia o PR.
      - name: Testes unitários com cobertura
        run: npm run coverage

      - name: Build de produção
        run: npm run build

      - name: Publicar o relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: Frontend/coverage

  dados:
    name: Dados e indicadores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes de validação, tratamento e cálculo
        run: node --test Data/indicadores/indicadores.test.mjs

      # Recalcula a partir da amostra versionada: o relatório tem de ser exatamente o mesmo.
      - name: Relatório reproduzível
        run: |
          node Data/indicadores/indicadores.mjs --amostra
          git diff --exit-code -- docs/evidencias/indicadores.md

  segredos:
    name: Detecção de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Confere os arquivos atuais (o histórico antigo é tratado no plano do projeto).
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  imagens:
    name: Imagens Docker (artefato)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # As mesmas receitas usadas na AWS e no Render, marcadas com o commit.
      - name: Montar a imagem da API
        run: docker build -t gastromatch-api:${{ github.sha }} Backend

      - name: Montar a imagem do front
        run: docker build -t gastromatch-web:${{ github.sha }} Frontend
