spring.application.name=gastromatch

# Conexão com o MySQL. A senha NÃO fica no arquivo: vem de variável de ambiente.
spring.datasource.url=jdbc:mysql://localhost:3306/gastromatch
spring.datasource.username=root
spring.datasource.password=P@ssw0rd

# Só para desenvolvimento: o Hibernate cria/ajusta a tabela a partir da entidade.
# Em produção isso sai, e o esquema passa a ser controlado por migrações.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita manter a sessão do banco aberta durante a renderização da resposta.
spring.jpa.open-in-view=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false