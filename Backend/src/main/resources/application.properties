spring.application.name=gastromatch

# Lê o arquivo Backend/.env (se existir) como propriedades. Assim ninguém precisa
# digitar $env:... a cada terminal. O .env NÃO vai para o GitHub (ver .gitignore).
spring.config.import=optional:file:.env[.properties]

# Conexão com o PostgreSQL (Supabase ou o Docker local). Os valores vêm do .env.
# Sem DB_URL e DB_USERNAME, usa o Postgres do docker-compose (localhost).
# A senha NÃO tem valor padrão: precisa estar no .env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gastromatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# O plano grátis do Supabase limita as conexões e a equipe inteira usa o mesmo banco:
# cada API usa no máximo 5 para não esgotar o limite.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# O banco é criado pelo SQL do projeto (Data/Modelagem). O Hibernate só CONFERE
# se as entidades batem com as tabelas e se recusa a subir quando não batem,
# dizendo qual coluna está errada. Ele não cria nem altera nada.
spring.jpa.hibernate.ddl-auto=validate

# Datas gravadas e lidas em UTC (as colunas são TIMESTAMPTZ).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Evita manter a sessão do banco aberta durante a renderização da resposta.
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
# No ar, troque pela variável de ambiente APP_CORS_ALLOWED_ORIGINS (endereços separados por vírgula).
# Endereço(s) do front liberados no CORS, separados por vírgula (em produção: o domínio do site).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# O Render e outros hosts mandam a porta pela variável PORT.
server.port=${PORT:8080}

# Só o /actuator/health fica exposto: o host usa para saber se a API está de pé.
management.endpoints.web.exposure.include=health


springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Upload de imagens (POST /imagens): pasta no servidor e limites de tamanho
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Imagens no Supabase Storage. Sem SUPABASE_URL, as imagens ficam no disco (app.uploads.dir).
app.supabase.url=${SUPABASE_URL:}
app.supabase.key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:imagens}

# Limpeza diária dos refresh tokens expirados (LimpezaTokensExpiradosJob, B25).
app.cleanup.enabled=${APP_CLEANUP_ENABLED:true}
app.cleanup.retencao-dias=${APP_CLEANUP_RETENCAO_DIAS:7}
app.cleanup.cron=${APP_CLEANUP_CRON:0 0 3 * * *}

# PUT /usuarios/me: a capa sempre pode ser o caminho devolvido por POST /imagens; para aceitar
# também um link https de fora, liste o(s) domínio(s) aqui (separados por vírgula). Vazio = só
# o próprio upload da API.
app.capa.allowed-hosts=${CAPA_ALLOWED_HOSTS:}

# Administrador inicial (AdminInicialRunner, B35): sem as três, nenhum admin é criado no
# startup. Nunca fixo no código; defina só uma vez, no ambiente onde for criar o admin.
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
