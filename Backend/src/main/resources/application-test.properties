# Perfil dos testes automatizados (CI e execução local com -Dspring.profiles.active=test).
# Os testes de unidade e de camada web (@WebMvcTest) não leem este arquivo (não sobem o
# datasource); quem usa é o ApplicationTests (@SpringBootTest) e qualquer teste de integração
# futuro que precise de um Postgres real (local via Docker ou o serviço do CI).

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Nada de SQL no log dos testes.
spring.jpa.show-sql=false

# O job de limpeza (B25) não deve disputar linhas com os testes nem depender de horário.
app.cleanup.enabled=false
