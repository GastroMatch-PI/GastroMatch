# Usado quando a API roda no ar (o Dockerfile já ativa este profile).

# Nada de SQL no log: enche o arquivo e expõe detalhes do banco.
spring.jpa.show-sql=false
logging.level.root=INFO

# A API fica atrás do proxy HTTPS do provedor: usa os cabeçalhos dele para saber o endereço real.
server.forward-headers-strategy=framework

# Ao reiniciar, termina as requisições em andamento antes de desligar.
server.shutdown=graceful
