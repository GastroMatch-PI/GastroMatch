# Banco MySQL local do GastroMatch. Passo a passo em SETUP-BANCO.md
services:
  mysql:
    image: mysql:8.0
    container_name: gastromatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - gastromatch-db:/var/lib/mysql
      # Roda só na PRIMEIRA criação do banco: cria o schema a partir do SQL do projeto
      - ../Data/Modelagem/GastroDB_v1.0.0.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  gastromatch-db:
