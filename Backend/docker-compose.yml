# Banco PostgreSQL local do GastroMatch, para testes. Passo a passo em SETUP-BANCO.md
# (o banco principal do time fica no Supabase).
services:
  postgres:
    image: postgres:16
    container_name: gastromatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: gastromatch
    ports:
      - "5432:5432"
    volumes:
      - gastromatch-db:/var/lib/postgresql/data
      # Rodam só na PRIMEIRA criação do banco, em ordem alfabética:
      # cria o schema a partir do SQL do projeto...
      - ../Data/Modelagem/GastroDB_v2.0.0_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # ...e carrega ingredientes e receitas de exemplo, para testar a API sem cadastrar nada à mão
      - ../Data/Modelagem/GastroDB_dados_exemplo.sql:/docker-entrypoint-initdb.d/02-dados.sql:ro

volumes:
  gastromatch-db:
